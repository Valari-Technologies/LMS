version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: onetutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: onetutor
      POSTGRES_USER: onetutor
      POSTGRES_PASSWORD: onetutor_dev_password
    ports:
      - "5432:5432"
    volumes:
      - onetutor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onetutor -d onetutor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onetutor_pgdata:
