<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051f18"/>
      <stop offset="60%" stop-color="#0a382c"/>
      <stop offset="100%" stop-color="#001812"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#008767" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgMern)"/>

  <!-- Tech grid pattern -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="68" x2="600" y2="68"/>
    <line x1="0" y1="136" x2="600" y2="136"/>
    <line x1="0" y1="204" x2="600" y2="204"/>
    <line x1="0" y1="272" x2="600" y2="272"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
  </g>

  <!-- Glow circle -->
  <circle cx="480" cy="180" r="140" fill="url(#glowG)"/>

  <!-- Left Content: Typography -->
  <text x="50" y="115" fill="#00e599" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5">MERN</text>
  <text x="50" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="1">FULL STACK</text>
  <text x="50" y="184" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="19" letter-spacing="0.8">DEVELOPMENT</text>

  <!-- Tech Stack Badges row -->
  <g transform="translate(50, 218)">
    <!-- MongoDB -->
    <circle cx="22" cy="22" r="19" fill="#0f2e24" stroke="#10b981" stroke-width="1.5"/>
    <path d="M22 10 C 23 15, 27 19, 27 24 C 27 27, 24 32, 22 34 C 20 32, 17 27, 17 24 C 17 19, 21 15, 22 10 Z" fill="#10b981"/>
    <line x1="22" y1="12" x2="22" y2="32" stroke="#051f18" stroke-width="1"/>

    <!-- Express -->
    <circle cx="68" cy="22" r="19" fill="#0f2e24" stroke="#4ade80" stroke-width="1.5"/>
    <text x="68" y="27" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="13" text-anchor="middle">ex</text>

    <!-- React -->
    <circle cx="114" cy="22" r="19" fill="#0f2e24" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="114" cy="22" rx="12" ry="4.5" fill="none" stroke="#38bdf8" stroke-width="1.2" transform="rotate(30 114 22)"/>
    <ellipse cx="114" cy="22" rx="12" ry="4.5" fill="none" stroke="#38bdf8" stroke-width="1.2" transform="rotate(-30 114 22)"/>
    <ellipse cx="114" cy="22" rx="12" ry="4.5" fill="none" stroke="#38bdf8" stroke-width="1.2" transform="rotate(90 114 22)"/>
    <circle cx="114" cy="22" r="2.2" fill="#38bdf8"/>

    <!-- Node JS -->
    <circle cx="160" cy="22" r="19" fill="#0f2e24" stroke="#22c55e" stroke-width="1.5"/>
    <text x="160" y="27" fill="#22c55e" font-family="sans-serif" font-weight="800" font-size="12" text-anchor="middle">JS</text>
  </g>

  <!-- Right Graphic: Coding Laptop & Floating Code Editor -->
  <g transform="translate(330, 75)" filter="url(#shadow)">
    <!-- Floating Editor Window -->
    <rect x="70" y="10" width="150" height="110" rx="8" fill="#0b1b16" stroke="#10b981" stroke-width="1.5"/>
    <!-- Window controls -->
    <circle cx="85" cy="22" r="3.5" fill="#ef4444"/>
    <circle cx="96" cy="22" r="3.5" fill="#f59e0b"/>
    <circle cx="107" cy="22" r="3.5" fill="#10b981"/>
    <!-- Code lines inside window -->
    <rect x="85" y="36" width="60" height="4" rx="2" fill="#38bdf8"/>
    <rect x="85" y="46" width="90" height="4" rx="2" fill="#4ade80"/>
    <rect x="95" y="56" width="70" height="4" rx="2" fill="#fbbf24"/>
    <rect x="95" y="66" width="105" height="4" rx="2" fill="#94a3b8"/>
    <rect x="85" y="76" width="45" height="4" rx="2" fill="#f43f5e"/>
    <rect x="85" y="86" width="80" height="4" rx="2" fill="#38bdf8"/>
    <rect x="85" y="96" width="50" height="4" rx="2" fill="#10b981"/>

    <!-- Laptop Base & Screen -->
    <g transform="translate(0, 50)">
      <rect x="10" y="15" width="165" height="105" rx="6" fill="#03100c" stroke="#334155" stroke-width="1.5"/>
      <rect x="18" y="23" width="149" height="89" rx="3" fill="#081e18"/>
      <!-- Screen content -->
      <path d="M30 45 L40 55 L30 65" fill="none" stroke="#00e599" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="65" x2="68" y2="65" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="30" y="76" width="55" height="4" rx="2" fill="#4ade80"/>
      <rect x="30" y="85" width="90" height="4" rx="2" fill="#64748b"/>
      <rect x="30" y="94" width="70" height="4" rx="2" fill="#38bdf8"/>

      <!-- Laptop keyboard base -->
      <path d="M0 120 L185 120 L170 134 L15 134 Z" fill="#1e293b"/>
      <rect x="75" y="122" width="35" height="3" rx="1.5" fill="#475569"/>
    </g>
  </g>
</svg>
