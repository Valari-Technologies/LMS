<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a14"/>
      <stop offset="50%" stop-color="#052c22"/>
      <stop offset="100%" stop-color="#01130e"/>
    </linearGradient>
    <linearGradient id="springG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cloudG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="sbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgSb)"/>

  <!-- Matrix/Circuit lines -->
  <g opacity="0.1" stroke="#34d399" stroke-width="1.5">
    <path d="M50 80 H180 V160 H260"/>
    <path d="M350 260 H420 V180 H550"/>
    <path d="M120 280 H220 V220"/>
    <circle cx="180" cy="80" r="3" fill="#34d399"/>
    <circle cx="260" cy="160" r="3" fill="#34d399"/>
    <circle cx="420" cy="180" r="3" fill="#34d399"/>
  </g>

  <!-- Spring Boot Icon (Left) -->
  <g transform="translate(60, 95)" filter="url(#sbShadow)">
    <circle cx="45" cy="45" r="42" fill="url(#springG)"/>
    <!-- White leaf icon -->
    <path d="M45 18 C30 24, 24 40, 29 55 C33 66, 45 72, 60 70 C57 58, 59 40, 68 28 C61 22, 53 19, 45 18 Z" fill="#ffffff"/>
    <path d="M31 52 C39 50, 48 44, 55 35" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Title in Center-Left -->
  <g transform="translate(165, 115)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="0.5">Cloud Native</text>
    <text x="0" y="28" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="21" letter-spacing="0.5">Spring Boot 3 &amp;</text>
    <text x="0" y="55" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="19" letter-spacing="0.5">Microservices</text>
  </g>

  <!-- Right Graphic: Cloud + Server Racks -->
  <g transform="translate(420, 85)" filter="url(#sbShadow)">
    <!-- Glowing Cloud -->
    <g transform="translate(10, 0)">
      <path d="M35 50 C20 50, 10 38, 15 25 C18 16, 28 10, 38 13 C45 2, 65 0, 78 8 C88 2, 102 7, 105 18 C118 18, 125 28, 122 38 C126 44, 120 50, 112 50 Z" fill="url(#cloudG)"/>
      <!-- Cloud arrows -->
      <path d="M68 36 V24 M62 29 L68 23 L74 29" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 3 Server Blades / Racks -->
    <g transform="translate(15, 68)">
      <!-- Server 1 -->
      <rect x="0" y="0" width="115" height="24" rx="4" fill="#0b241c" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="3" fill="#10b981"/>
      <line x1="24" y1="12" x2="48" y2="12" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
      <circle cx="85" cy="12" r="2.5" fill="#38bdf8"/>
      <circle cx="95" cy="12" r="2.5" fill="#4ade80"/>
      <circle cx="105" cy="12" r="2.5" fill="#fbbf24"/>

      <!-- Server 2 -->
      <rect x="0" y="30" width="115" height="24" rx="4" fill="#0b241c" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="12" cy="42" r="3" fill="#10b981"/>
      <line x1="24" y1="42" x2="48" y2="42" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
      <circle cx="85" cy="42" r="2.5" fill="#4ade80"/>
      <circle cx="95" cy="42" r="2.5" fill="#38bdf8"/>
      <circle cx="105" cy="42" r="2.5" fill="#4ade80"/>

      <!-- Server 3 -->
      <rect x="0" y="60" width="115" height="24" rx="4" fill="#0b241c" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="12" cy="72" r="3" fill="#10b981"/>
      <line x1="24" y1="72" x2="48" y2="72" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
      <circle cx="85" cy="72" r="2.5" fill="#fbbf24"/>
      <circle cx="95" cy="72" r="2.5" fill="#4ade80"/>
      <circle cx="105" cy="72" r="2.5" fill="#38bdf8"/>
    </g>
  </g>
</svg>
